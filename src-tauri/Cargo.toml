[package]
name = "SkillsAI"
version = "0.1.0"
edition = "2021"

[lib]
name = "skills_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sysinfo = "0.30"
chrono = "0.4"
http = "1.0"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"
dotenvy = "0.15"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
mime_guess = "2.0"
# Rust-side error reporting (see src/telemetry.rs). `default-features = false`
# is load-bearing: the default `transport` feature pulls native-tls, a second
# TLS stack beside the rustls-only reqwest above. sentry wants reqwest 0.13,
# which is the version already pinned here, so this adds no duplicate client.
# No `logs`/`metrics`/`release-health` — errors and panics only.
# No `debug-images`: it attaches the running binary's own path to every event
# (DebugImagesIntegration filters nothing), which on a Downloads-folder launch
# or a Windows per-user install carries the username straight past the path
# scrubbing in telemetry.rs. It exists so Sentry can symbolicate native frames
# against uploaded debug files, and nothing in CI uploads any — so it is pure
# leak here. Rust panic frames arrive symbolicated by `backtrace` regardless.
# `rustls-no-provider`, NOT `rustls`: sentry's plain `rustls` resolves to
# reqwest 0.13's `__rustls-aws-lc-rs`, dragging in aws-lc-rs/aws-lc-sys (C and
# assembly, needing NASM on x86_64-windows). The reqwest above already requests
# that path on its own here, so this is not what puts aws-lc in the graph — but
# sentry must not be a second, independent reason for it.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls-no-provider",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Forwards deep links (custom URI scheme callbacks) to the already-running
# instance. The `deep-link` feature delivers the URL via the deep-link plugin's
# `on_open_url` for both cold and warm starts.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"
block = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the shipped version out of tauri.conf.json for the Sentry release tag;
# already in the graph via tauri-build, so this adds no download.
serde_json = "1.0"
